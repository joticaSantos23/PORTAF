    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark: #121212;
            --light: #ffffff;
            --gray: #f4f4f4;
            --text-muted: #666;
            --accent: #0070f3; /* Azul profesional sutil */
        }

        body {
            background-color: var(--light);
            color: var(--dark);
            font-family: 'Inter', sans-serif;
            margin: 0;
            line-height: 1.6;
        }

        /* Header Minimalista */
        header {
            padding: 80px 5% 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 8vw, 4rem);
            margin: 0;
            font-weight: 700;
        }

        header p {
            font-size: 1.1rem;
            color: var(--text-muted);
            max-width: 500px;
            margin-top: 20px;
        }

        /* Grilla Profesional */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 30px;
            padding: 0 5% 100px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .project-card {
            text-decoration: none;
            color: inherit;
            position: relative;
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        /* Variaciones de tamaño para ritmo visual */
        .col-8 { grid-column: span 8; }
        .col-4 { grid-column: span 4; }
        .col-6 { grid-column: span 6; }

        .img-container {
            width: 100%;
            aspect-ratio: 16 / 10;
            background-color: var(--gray);
            border-radius: 4px; /* Radio pequeño para seriedad */
            overflow: hidden;
            margin-bottom: 15px;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(20%);
            transition: all 0.5s ease;
        }

        .project-card:hover img {
            filter: grayscale(0%);
            transform: scale(1.03);
        }

        .project-info h3 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .project-info span {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Footer / Contacto */
        footer {
            border-top: 1px solid #eee;
            padding: 60px 5%;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Ajuste para móviles */
        @media (max-width: 850px) {
            .col-8, .col-4, .col-6 { grid-column: span 12; }
            header { padding: 40px 5%; }
        }
    </style>
</head>
