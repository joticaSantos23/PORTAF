<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Premium Grid</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #e2f033; /* El amarillo de fondo de tu referencia */
            --bg-card-white: #ffffff;
            --text-dark: #1a1a1a;
            --radius-main: 24px;
        }

        body {
            background-color: var(--bg-canvas);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        /* El contenedor blanco que envuelve todo */
        .main-wrapper {
            background: white;
            width: 100%;
            max-width: 1000px;
            border-radius: 40px;
            padding: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        /* Menú superior igual a la foto */
        nav {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 50px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #999;
        }
        nav span.active { color: var(--text-dark); text-decoration: underline; }

        /* Grilla Bento: Aquí está la magia del orden */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 columnas base */
            grid-auto-rows: 240px; /* Altura fija para que no se desordene */
            gap: 20px;
        }

        .card {
            border-radius: var(--radius-main);
            overflow: hidden;
            position: relative;
            text-decoration: none;
            color: var(--text-dark);
            transition: transform 0.3s ease;
        }

        .card:hover { transform: scale(0.98); }

        /* Tamaños específicos para que encajen */
        .tall { grid-row: span 2; }
        .wide { grid-column: span 2; }

        /* Estilos de contenido */
        .card-content {
            padding: 25px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 2;
            position: relative;
        }

        .tag {
            font-size: 0.6rem;
            font-weight: 800;
            border: 1px solid rgba(0,0,0,0.1);
            padding: 4px 8px;
            border-radius: 4px;
            width: fit-content;
        }

        .card h3 {
            font-size: 1.3rem;
            margin: 15px 0;
            line-height: 1.2;
            font-weight: 800;
        }

        .btn-round {
            width: 35px;
            height: 35px;
            background: var(--text-dark);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: auto;
        }

        /* Colores pastel de la referencia */
        .lavender { background-color: #bebce1; }
        .orange { background-color: #f17b43; color: white; }
        .sage { background-color: #c9d6c8; }
        .yellow-card { background-color: #f3f374; }

        /* Imágenes de fondo */
        .bg-img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Responsive */
        @media (max-width: 800px) {
            .bento-grid { grid-template-columns: 1fr; grid-auto-rows: auto; }
            .tall, .wide { grid-row: span 1; grid-column: span 1; }
            .card { min-height: 300px; }
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <nav>
        <span>GIVEAWAY</span>
        <span class="active">MIS TRABAJOS</span>
        <span>PRODUCT LAUNCH</span>
        <span>CONTACTO</span>
    </nav>

    <div class="bento-grid">
        
        <a href="LINK_PROYECTO" class="card lavender tall">
            <div class="card-content">
                <div class="tag">WEB APP</div>
                <h3>Sistema de Facturación Moderna</h3>
                <div class="btn-round">→</div>
            </div>
        </a>

        <div class="card wide">
            <img src="https://images.unsplash.com/photo-1515879218367-8466d910aaa4?w=800" class="bg-img" alt="Code">
        </div>

        <a href="LINK_PROYECTO" class="card orange">
            <div class="card-content">
                <div class="tag" style="border-color: white;">UI DESIGN</div>
                <h3>App de Clima & Temperatura</h3>
                <div class="btn-round" style="background:white; color:black;">→</div>
            </div>
        </a>

        <a href="LINK_PROYECTO" class="card sage">
            <div class="card-content">
                <div class="tag">API</div>
                <h3>Poke API Explorer</h3>
                <div class="btn-round">→</div>
            </div>
        </a>

        <div class="card wide tall">
            <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=800" class="bg-img" alt="Laptop">
        </div>

        <a href="LINK_PROYECTO" class="card yellow-card">
            <div class="card-content">
                <div class="tag">GAME</div>
                <h3>Juego de Carreras JS</h3>
                <div class="btn-round">→</div>
            </div>
        </a>

    </div>
</div>

</body>
</html>
