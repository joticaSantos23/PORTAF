<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portafolio Profesional</title>
    <style>
        /* 1. RESET Y ESTILOS BASE */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            font-size: 2.5rem;
            color: #2d3436;
            margin-bottom: 10px;
        }

        header p {
            color: #636e72;
            font-size: 1.1rem;
        }

        /* 2. GRID DE PROYECTOS */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        /* 3. LA TARJETA (CARD) */
        .project-card {
            position: relative;
            height: 280px;
            border-radius: 15px;
            overflow: hidden;
            background-color: #fff;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            text-decoration: none;
            display: block;
            /* Animación de entrada inicial */
            opacity: 0;
            transform: translateY(20px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        box-shadow 0.3s ease, 
                        opacity 0.6s ease;
        }

        /* Clase para activar la aparición con JS */
        .project-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Imagen de fondo (Vista previa) */
        .preview-img {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: top center;
            transition: transform 0.6s ease;
        }

        /* Capa oscura superior (Overlay) */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85); /* Azul muy oscuro elegante */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            opacity: 0; /* Invisible por defecto */
            transition: opacity 0.4s ease;
            backdrop-filter: blur(3px); /* Efecto de desenfoque */
        }

        .overlay h3 {
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 10px;
            transform: translateY(20px);
            transition: transform 0.4s ease;
        }

        .overlay p {
            color: #dfe6e9;
            font-size: 0.9rem;
            margin-bottom: 20px;
            transform: translateY(20px);
            transition: transform 0.4s ease 0.1s;
        }

        .btn-visit {
            background-color: #00cec9;
            color: white;
            padding: 8px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* 4. EFECTOS HOVER (AL PASAR EL MOUSE) */
        .project-card:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        .project-card:hover .preview-img {
            transform: scale(1.1); /* Zoom a la imagen */
        }

        .project-card:hover .overlay {
            opacity: 1; /* Mostrar info */
        }

        .project-card:hover .overlay h3, 
        .project-card:hover .overlay p {
            transform: translateY(0); /* Subir texto suavemente */
        }

        /* Responsive */
        @media (max-width: 600px) {
            .projects-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

    <script>
        // Pequeño script para que las tarjetas aparezcan con retraso al cargar
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.project-card');
            cards.forEach((card, index) => {
