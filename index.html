<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Minimal Grid</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --text: #111111;
            --accent: #007aff; /* Azul Apple, muy profesional */
            --gray-light: #f5f5f7;
            --gap: 30px;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 60px 20px;
        }

        .header {
            max-width: 1200px;
            margin: 0 auto 60px auto;
            text-align: left;
        }

        .header h1 { font-weight: 600; font-size: 2rem; margin: 0; letter-spacing: -1px; }
        .header p { color: #888; margin-top: 10px; }

        /* Grilla ultra ordenada: Filas e hileras perfectas */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: var(--gap);
            max-width: 1200px;
            margin: 0 auto;
        }

        .project-card {
            background: var(--bg);
            border: 1px solid #eee;
            border-radius: 16px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            position: relative;
            /* Animación de entrada */
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* --- ANIMACIONES AL PASAR EL CURSOR --- */
        .project-card:hover {
            transform: translateY(-8px); /* Se eleva */
            border-color: var(--accent);
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
        }

        .img-box {
            width: 100%;
            aspect-ratio: 1 / 1; /* Cuadros perfectos */
            background: var(--gray-light);
            overflow: hidden;
            position: relative;
        }

        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .project-card:hover .img-box img {
            transform: scale(1.1); /* Zoom suave a la imagen */
        }

        /* Overlay que aparece en hover */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 122, 255, 0.05);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .project-card:hover .overlay { opacity: 1; }

        .info {
            padding: 20px;
            border-top: 1px solid #f0f0f0;
        }

        .info h3 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .info span {
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: 500;
            display: block;
            margin-bottom: 5px;
        }

        /* Footer limpio */
        footer {
            margin-top: 100px;
            text-align: center;
            font-size: 0.8rem;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div class="header">
