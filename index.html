    <title>Portfolio | Grilla Modular</title>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --text: #000000;
            --border: #e0e0e0; /* Gris muy suave para líneas */
            --text-muted: #888888;
            --font-main: 'Geist', sans-serif;
            --gap: 1px; /* Espacio mínimo entre tarjetas para efecto de línea */
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Contenedor Principal con bordes externos */
        .portfolio-container {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 columnas perfectas */
            background-color: var(--border); /* El fondo actúa como la línea de división */
            gap: var(--gap);
            border-bottom: 1px solid var(--border);
        }

        /* Estilo de la Tarjeta (Limpio y Simétrico) */
        .project-card {
            background-color: var(--bg);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        /* Efecto Hover Sutil (Cambio de fondo o leve zoom) */
        .project-card:hover {
            background-color: #fafafa;
        }

        /* Contenedor de Imagen (Mismo tamaño para todas) */
        .img-wrapper {
            width: 100%;
            aspect-ratio: 16 / 10; /* Proporción perfecta */
            overflow: hidden;
        }

        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .project-card:hover .img-wrapper img {
            transform: scale(1.04);
        }

        /* Info del Proyecto (Abajo de la imagen) */
        .project-info {
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
        }

        .project-info h3 {
            margin: 0;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: -0.3px;
        }

        .project-meta {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            padding-top: 15px;
        }

        /* Flecha indicadora (Aparece en hover) */
        .arrow {
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.3s ease;
            font-size: 1.1rem;
        }

        .project-card:hover .arrow {
            opacity: 1;
            transform: translateX(0);
        }

        /* Ajuste para móviles (1 columna) */
        @media (max-width: 900px) {
            .portfolio-container { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 600px) {
            .portfolio-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
